<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="elbeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Dark Background (Matches GitHub Dark Mode) -->
  <rect width="500" height="500" rx="100" fill="#0d1117" />

  <!-- Outer Glow Ring (Optional Accent) -->
  <rect x="10" y="10" width="480" height="480" rx="90" fill="none" stroke="#30363d" stroke-width="4" />

  <!-- Code Bracket Left < -->
  <path d="M 150 180 L 90 250 L 150 320" 
        stroke="url(#elbeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Elbe River Wave (Center Slash) -->
  <path d="M 190 330 C 230 230, 270 270, 310 170" 
        stroke="url(#elbeGrad)" stroke-width="26" stroke-linecap="round" fill="none" />

  <!-- Code Bracket Right > -->
  <path d="M 350 180 L 410 250 L 350 320" 
        stroke="url(#elbeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
